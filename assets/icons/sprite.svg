    <path d="M9 4h-2a3 3 0 0 0-3 3v10a3 3 0 0 1-3 3"/><path d="M15 4h2a3 3 0 0 1 3 3v10a3 3 0 0 0 3 3"/><path d="M8 12h8"/>
