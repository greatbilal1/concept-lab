  <!-- ============================================================
       OOP visual vocabulary — content icons used inside explainer
       scenes (person, bank, database, object, class, function,
       memory, lock, inheritance, document, risk, calculator, tool).
       Same 24x24 stroke style so they compose with the UI icons.
       ============================================================ -->

  <symbol id="i-person" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="8" r="3.5"/><path d="M5 20a7 7 0 0 1 14 0"/>
  </symbol>

  <symbol id="i-bank" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
