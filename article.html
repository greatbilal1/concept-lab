<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Article — Concept Lab</title>
<link rel="icon" type="image/svg+xml" href="assets/icons/favicon.svg">
<link rel="stylesheet" href="assets/css/tokens.css">
<link rel="stylesheet" href="assets/css/site.css">
<link rel="stylesheet" href="assets/css/anim.css">
<style>
  .article-header {
    margin-bottom: 2rem;
    text-align: center;
  }
  .article-tag-row {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 1rem;
    background: rgba(15, 23, 42, 0.8);
    border: 1px solid rgba(56, 189, 248, 0.25);
    padding: 5px 14px;
    border-radius: 9999px;
  }
  .article-category {
    color: #38bdf8;
    font-weight: 700;
    font-size: 0.75rem;
    text-transform: uppercase;
    letter-spacing: 0.06em;
  }
  .article-dot {
    color: #475569;
    font-size: 0.8rem;
  }
  .article-read-time {
    color: #94a3b8;
    font-size: 0.8rem;
    font-weight: 500;
  }
  .article-title {
    font-size: 2.3rem;
    line-height: 1.25;
    margin-bottom: 1.25rem;
    color: #f8fafc;
    max-width: 800px;
    margin-left: auto;
    margin-right: auto;
  }
  .article-meta {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 0.85rem;
    color: var(--muted);
  }
  .article-author-avatar {
    width: 38px;
    height: 38px;
    border-radius: 50%;
    background: linear-gradient(135deg, #2563eb, #7c3aed);
    color: #ffffff;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: bold;
    font-size: 13px;
    border: 1px solid rgba(255, 255, 255, 0.2);
    box-shadow: 0 0 12px rgba(37, 99, 235, 0.35);
  }
  .article-author-meta {
    text-align: left;
    display: flex;
    flex-direction: column;
  }
  .article-author-name {
    color: #f1f5f9;
    font-weight: 600;
    font-size: 0.92rem;
  }
  .article-date {
    color: #64748b;
    font-size: 0.8rem;
  }
  .article-hero-img {
    width: 100%;
    max-width: 800px;
    height: auto;
    max-height: 450px;
    display: block;
    margin: 0 auto 2.5rem auto;
    border-radius: 12px;
    border: 1px solid rgba(255, 255, 255, 0.1);
    box-shadow: 0 20px 40px -15px rgba(0, 0, 0, 0.6);
    background: #0a0f1d;
  }
  .article-body {
    max-width: 760px;
    margin: 0 auto;
    font-size: 1.1rem;
    line-height: 1.8;
    color: var(--text);
  }
  .article-body h3 {
    margin-top: 2.5rem;
    margin-bottom: 1rem;
    font-size: 1.5rem;
    color: #fff;
  }
  .article-body p {
    margin-bottom: 1rem;
  }
  .article-body ul {
    margin-bottom: 1.5rem;
    padding-left: 1.5rem;
  }
  .article-body li {
    margin-bottom: 0.5rem;
  }
  .article-author-card {
    display: flex;
    align-items: center;
    gap: 1.5rem;
    max-width: 760px;
    margin: 3rem auto 2rem;
    padding: 1.5rem;
    border: 1px solid rgba(148, 163, 184, 0.2);
    border-radius: 16px;
    background: linear-gradient(135deg, rgba(15, 23, 42, 0.96), rgba(30, 41, 59, 0.72));
    box-shadow: 0 18px 40px rgba(0, 0, 0, 0.22);
  }
  .article-author-photo {
    width: 112px;
    height: 112px;
    flex: 0 0 112px;
    object-fit: cover;
    object-position: center 30%;
    border-radius: 50%;
    border: 2px solid rgba(125, 211, 252, 0.55);
    box-shadow: 0 0 24px rgba(56, 189, 248, 0.18);
  }
  .article-author-copy { min-width: 0; }
  .article-author-eyebrow {
    margin: 0 0 0.25rem;
    color: #7dd3fc;
    font-size: 0.72rem;
    font-weight: 700;
    letter-spacing: 0.12em;
    text-transform: uppercase;
  }
  .article-author-heading {
    margin: 0 0 0.55rem;
    color: #f8fafc;
    font-size: 1.2rem;
  }
  .article-author-bio {
    margin: 0 0 1rem;
    color: #cbd5e1;
    font-size: 0.94rem;
    line-height: 1.65;
  }
  .article-linkedin {
    display: inline-flex;
    align-items: center;
    gap: 0.5rem;
    color: #7dd3fc;
    font-size: 0.9rem;
    font-weight: 650;
    text-decoration: none;
    transition: color 0.2s ease, transform 0.2s ease;
  }
  .article-linkedin:hover { color: #fff; transform: translateY(-1px); }
  .article-linkedin:focus-visible {
    outline: 2px solid #7dd3fc;
    outline-offset: 4px;
    border-radius: 3px;
  }
  .article-linkedin svg { width: 20px; height: 20px; fill: currentColor; }
  .article-course-box {
    background: var(--panel);
    border: 1px solid var(--border, #1e293b);
    border-left: 4px solid var(--accent);
    padding: 1.5rem;
    border-radius: 8px;
    margin: 2rem 0;
  }
  .article-course-box h4 {
    margin: 0 0 0.5rem 0;
    color: #fff;
  }
  .article-course-box p {
    margin: 0;
    font-size: 0.95rem;
  }
  .article-course-box a {
    color: var(--accent);
    font-weight: 600;
  }
  .back-link {
    display: inline-block;
    margin-bottom: 1.5rem;
    color: var(--muted);
    text-decoration: none;
    font-weight: 500;
    transition: color 0.2s;
  }
  .back-link:hover {
    color: var(--accent);
  }
  .glossary-term {
    color: var(--accent);
    text-decoration: underline dotted var(--accent);
    text-underline-offset: 3px;
    font-weight: 500;
    transition: all 0.2s ease;
  }
  .glossary-term:hover {
    color: #fff;
    text-decoration: underline solid var(--accent);
    background: rgba(103, 232, 249, 0.15);
    border-radius: 4px;
    padding: 2px 4px;
  }
  @media (max-width: 560px) {
    .article-author-card { align-items: flex-start; gap: 1rem; padding: 1.1rem; }
    .article-author-photo { width: 76px; height: 76px; flex-basis: 76px; }
    .article-author-heading { font-size: 1.05rem; }
  }
  @media (max-width: 390px) {
    .article-author-card { flex-direction: column; align-items: center; text-align: center; }
  }
</style>
</head>
<body>

<div class="bg-orbs" aria-hidden="true">
  <div class="orb a"></div><div class="orb b"></div><div class="orb c"></div>
</div>
<div class="grid-overlay" aria-hidden="true"></div>

<div class="wrap">

<div class="topbar">
  <div class="topbar-inner">
    <a class="logo" href="index.html"><span class="mark">CL</span> Concept&nbsp;Lab</a>
    <nav class="topnav">
      <a href="courses.html">All Courses</a>
      <a href="index.html#paths">Paths</a>
      <a href="glossary.html">Glossary</a>
      <a href="news.html">AI News</a>
    </nav>
    <div class="search">
      <input id="siteSearch" type="search" placeholder="Search courses, terms…"
             autocomplete="off" aria-label="Search the site">
      <div id="searchResults" class="search-results" role="listbox"></div>
    </div>
  </div>
</div>

<main class="page-content" id="articleContainer">
  <!-- Filled by JS -->
</main>

<footer>
  <p><b>Concept Lab</b> — a no-login learning space.</p>
  <p class="small">Built as self-contained offline HTML. No tracking, no accounts, no dependencies.</p>
</footer>

</div>

<script src="data/courses.js"></script>
<script src="data/glossary.js"></script>
<script src="data/news.js"></script>
<script src="assets/js/search.js"></script>
<script>
  document.addEventListener('DOMContentLoaded', () => {
    const params = new URLSearchParams(window.location.search);
    const id = params.get('id');
    const container = document.getElementById('articleContainer');

    function formatDate(dStr) {
      if (!dStr) return '';
      const parts = dStr.split('-');
      if (parts.length !== 3) return dStr;
      const months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
      const month = months[parseInt(parts[1], 10) - 1] || parts[1];
      return `${month} ${parseInt(parts[2], 10)}, ${parts[0]}`;
    }

    if (!id || !window.NEWS) {
      container.innerHTML = '<p>Article not found.</p>';
      return;
    }

    const article = window.NEWS.find(a => a.id === id);
    if (!article) {
      container.innerHTML = '<p>Article not found.</p>';
      return;
    }

    document.title = `${article.title} — Concept Lab`;
    const initials = (article.author || 'BF').split(' ').map(n => n[0]).join('').substring(0, 2);

    container.innerHTML = `
      <a href="news.html" class="back-link">&larr; Back to all news</a>
      
      <div class="article-header">
        <div class="article-tag-row">
          <span class="article-category">${article.category || 'AI NEWS'}</span>
          <span class="article-dot">•</span>
          <span class="article-read-time">${article.readTime || '4 min read'}</span>
        </div>
        <h1 class="article-title">${article.title}</h1>
        <div class="article-meta">
          <div class="article-author-avatar">${initials}</div>
          <div class="article-author-meta">
            <span class="article-author-name">${article.author}</span>
            <span class="article-date">${formatDate(article.date)}</span>
          </div>
        </div>
      </div>
      
      <img src="${article.image}" alt="${article.title}" class="article-hero-img">
      
      <div class="article-body">
        ${article.content}
      </div>

      <section class="article-author-card" aria-labelledby="article-author-heading">
        <img class="article-author-photo" src="assets/images/bilal-fleifel.png" alt="Portrait of Bilal Fleifel" loading="lazy">
        <div class="article-author-copy">
          <p class="article-author-eyebrow">About the author</p>
          <h2 class="article-author-heading" id="article-author-heading">Bilal Fleifel</h2>
          <p class="article-author-bio">Bilal writes about applied AI and the engineering behind useful, reliable AI products. Through Concept Lab, he makes topics like generative AI, language models, AI agents, evaluation, and safety easier to understand.</p>
          <a class="article-linkedin" href="https://www.linkedin.com/in/bilalfl/" target="_blank" rel="me noopener noreferrer" aria-label="Connect with Bilal Fleifel on LinkedIn (opens in a new tab)">
            <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M20.45 2H3.55C2.69 2 2 2.68 2 3.52v16.96c0 .84.69 1.52 1.55 1.52h16.9c.86 0 1.55-.68 1.55-1.52V3.52c0-.84-.69-1.52-1.55-1.52zM7.93 18.34H4.96V9.01h2.97v9.33zM6.45 7.73a1.72 1.72 0 1 1 0-3.44 1.72 1.72 0 0 1 0 3.44zm11.89 10.61h-2.97v-4.54c0-1.08-.02-2.47-1.51-2.47-1.51 0-1.74 1.18-1.74 2.39v4.62H9.15V9.01h2.85v1.27h.04c.4-.75 1.37-1.54 2.82-1.54 3.01 0 3.57 1.98 3.57 4.55v5.05z"/></svg>
            <span>Connect on LinkedIn</span>
          </a>
        </div>
      </section>
    `;
  });
</script>
</body>
</html>
